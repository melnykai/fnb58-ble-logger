name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libglib2.0-dev
      - name: Build
        run: cmake -S . -B build && cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  openspec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate specs and changes
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive
