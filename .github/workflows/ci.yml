name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64          # the daemon's target is a Raspberry Pi
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libglib2.0-dev
      - name: Build, warnings as errors
        run: cmake -S . -B build -DFNB58_WERROR=ON && cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: unit tests under ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libglib2.0-dev
      - name: Build with sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFNB58_WERROR=ON -DFNB58_SANITIZE=ON && cmake --build build -j
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  openspec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate specs and changes
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive
